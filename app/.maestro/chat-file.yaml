# A file in a chat (José 17/11: «no podemos descargar el archivo»): a KML that came as application/octet-stream.
#
# Before: `npx tsx scripts/e2e-dali.ts` running (it seeds «METRADOS 161126.kml» in Paola Ríos's chat and serves it),
# Metro with EXPO_PUBLIC_API_URL=http://10.0.2.2:4003 and the debug build installed.
#
#   maestro --device "$ANDROID_SERIAL" test app/.maestro/chat-file.yaml
#
# Then `adb shell ls /sdcard/Download` lists «METRADOS 161126.kml» (the phone's downloader kept it).
appId: com.lilachat.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "btn-entrar-telefono"
    timeout: 60000
- tapOn:
    id: "btn-entrar-telefono"
- tapOn:
    id: "input-telefono"
- inputText: "900000099"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Verificar Número"
    timeout: 20000
- inputText: "424242"
- extendedWaitUntil:
    visible: "Dali · Constroad QA"
    timeout: 20000
- tapOn: "Abrir"
- extendedWaitUntil:
    visible:
      id: "espacio-dali"
    timeout: 20000
- runFlow:
    when:
      visible: "Open debugger to view warnings."
    commands:
      - tapOn:
          point: "96%,92%"
- tapOn:
    id: "vista-bandeja-all"
- scrollUntilVisible:
    element: "Paola Ríos"
    timeout: 15000
    visibilityPercentage: 40
    centerElement: true
- tapOn: "Paola Ríos"
- extendedWaitUntil:
    visible: "METRADOS 161126.kml"
    timeout: 15000
- takeScreenshot: f1-archivo-en-el-chat

# A tap offers the two ways out.
- tapOn: "METRADOS 161126.kml"
- extendedWaitUntil:
    visible: "Descargar"
    timeout: 5000
- assertVisible: "Abrir"
- takeScreenshot: f2-abrir-o-descargar

# Download: the phone's own downloader (the browser) keeps it in Downloads with its own name. Chrome's first run
# may ask first; those screens are passed if they show.
- tapOn: "Descargar"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "Use without an account|Usar sin una cuenta"
    commands:
      - tapOn: "Use without an account|Usar sin una cuenta"
- runFlow:
    when:
      visible: "Accept & continue|Aceptar y continuar"
    commands:
      - tapOn: "Accept & continue|Aceptar y continuar"
- runFlow:
    when:
      visible: "No thanks|No, gracias"
    commands:
      - tapOn: "No thanks|No, gracias"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: f3-descargando
- launchApp:
    stopApp: false
- runFlow:
    when:
      notVisible: "METRADOS 161126.kml"
    commands:
      - tapOn: "Paola Ríos"
- extendedWaitUntil:
    visible: "METRADOS 161126.kml"
    timeout: 15000

# Open: no app takes a KML on this phone, so the share sheet appears instead of an error.
- tapOn: "METRADOS 161126.kml"
- tapOn: "Abrir"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: f5-abrir
