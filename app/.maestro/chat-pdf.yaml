# José 17/11 night: a PDF shows its first page in the chat (like WhatsApp) and the viewer opens it. The pinch is
# not a Maestro gesture: it is sent with `adb shell sendevent` on the multi-touch device after this flow.
# («:hug» in a thread is not here: the dev server cannot load the lazy emoji table in this monorepo, in any composer.)
#
# Before: `npx tsx scripts/e2e-dali.ts` running (it seeds «Cotización estacionamiento.pdf» in Paola Ríos's chat),
# Metro with EXPO_PUBLIC_API_URL=http://10.0.2.2:4003 and the debug build installed.
#
#   maestro --device "$ANDROID_SERIAL" test app/.maestro/chat-pdf.yaml
appId: com.lilachat.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "btn-entrar-telefono"
    timeout: 60000
- tapOn:
    id: "btn-entrar-telefono"
- tapOn:
    id: "input-telefono"
- inputText: "900000099"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Verificar Número"
    timeout: 20000
- inputText: "424242"
- extendedWaitUntil:
    visible: "Dali · Constroad QA"
    timeout: 20000
- tapOn: "Abrir"
- extendedWaitUntil:
    visible:
      id: "espacio-dali"
    timeout: 20000
- runFlow:
    when:
      visible: "Open debugger to view warnings."
    commands:
      - tapOn:
          point: "96%,92%"
- tapOn:
    id: "vista-bandeja-all"
- scrollUntilVisible:
    element: "Paola Ríos"
    timeout: 15000
    visibilityPercentage: 40
    centerElement: true
- tapOn: "Paola Ríos"

# The card: first page, name and «4 páginas · … · PDF».
- extendedWaitUntil:
    visible: "Cotización estacionamiento.pdf"
    timeout: 15000
- assertVisible: "4 páginas · .* · PDF"
- takeScreenshot: p1-tarjeta-pdf

# The viewer: the PDF opens inside the app.
- tapOn: "Cotización estacionamiento.pdf"
- runFlow:
    when:
      visible: "Ver"
    commands:
      - tapOn: "Ver"
- extendedWaitUntil:
    visible:
      id: "visor-pdf"
    timeout: 20000
- extendedWaitUntil:
    visible: "1 / 4"
    timeout: 20000
- takeScreenshot: p4-visor
