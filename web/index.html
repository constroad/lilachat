<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6b38d4" />
    <!-- The saved theme before the first paint, so dark mode never flashes white (21/10). -->
    <script src="/tema-inicial.js"></script>
    <title>Lilachat</title>
    <meta name="description" content="Chats, grupos, agenda y llamadas de Constroad, en tu computadora." />
    <!-- Instalable (W0): ícono, color y nombre al agregarla al escritorio o al inicio. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- La tarjeta al compartir el enlace en WhatsApp: imagen ABSOLUTA, con su tamaño. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lilachat" />
    <meta property="og:title" content="Lilachat" />
    <meta property="og:description" content="Chats, grupos, agenda y llamadas de Constroad, en tu computadora." />
    <meta property="og:url" content="https://lilachat.constroad.com/" />
    <meta property="og:image" content="https://lilachat.constroad.com/icons/og-1200x630.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
